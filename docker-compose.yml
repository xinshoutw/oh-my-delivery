services:
  postgres:
    image: postgres:16-alpine
    container_name: omd-postgres
    environment:
      POSTGRES_USER: omd
      POSTGRES_PASSWORD: omd
      POSTGRES_DB: omd
    ports:
      - "5432:5432"
    volumes:
      - omd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omd -d omd"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  omd_pgdata:
